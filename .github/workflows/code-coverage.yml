name: C++ Code Coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: GCC coverage
    runs-on: ubuntu-24.04

    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GCC, Ninja and Python venv support
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build python3-venv

      - name: Generate coverage reports
        run: ./bld.sh coverage --gcov-executable gcov-14

      - name: Add coverage summary
        run: cat .build-coverage/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: arq-cpp-coverage
          path: .build-coverage/coverage/
          if-no-files-found: error
          retention-days: 30
