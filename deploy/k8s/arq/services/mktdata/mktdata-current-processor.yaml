apiVersion: apps/v1
kind: Deployment
metadata:
  name: mktdata-current-processor
  labels:
    app: mktdata-current-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mktdata-current-processor
  template:
    metadata:
      labels:
        app: mktdata-current-processor
    spec:
      imagePullSecrets:
        - name: arq-dockerhub-cred
      containers:
        - name: mktdata-current-processor
          image: ej20002011/arq:master
          imagePullPolicy: Always
          command: ["MktDataCurrentProcessor"]

          ports:
            - name: admin-port
              containerPort: 8080

          startupProbe:
            httpGet:
              path: /health/startup
              port: admin-port
            failureThreshold: 20 # 20 * 3 = 60 seconds = 1 minute to give for startup
            periodSeconds: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: admin-port
            failureThreshold: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health/live
              port: admin-port
            failureThreshold: 3
            periodSeconds: 5

          resources:
            limits:
              memory: "512M"
              cpu: "1"
